<!doctype html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, user-scalable=no">
<title>Dora Drive</title>
<style>
  html, body { margin: 0; height: 100%; background: #000; overflow: hidden; touch-action: none; }
  #game { position: fixed; inset: 0; }
  #game ruffle-player { width: 100%; height: 100%; }
  .btn {
    position: fixed; bottom: 20px; width: 80px; height: 80px; border-radius: 50%;
    background: rgba(255,255,255,.25); border: 3px solid rgba(255,255,255,.6);
    color: #fff; font: bold 32px sans-serif; display: flex; align-items: center; justify-content: center;
    user-select: none; -webkit-user-select: none; -webkit-touch-callout: none;
    z-index: 10;
  }
  .btn.down { background: rgba(255,255,255,.5); }
  #left  { left: 20px; }
  #right { left: 120px; }
  #gas   { right: 20px; }
</style>
</head>
<body>
<div id="game"></div>
<div class="btn" id="left"  data-key="ArrowLeft">◀</div>
<div class="btn" id="right" data-key="ArrowRight">▶</div>
<div class="btn" id="gas"   data-key="ArrowUp">▲</div>

<script src="https://unpkg.com/@ruffle-rs/ruffle@0.7.1/ruffle.js"></script>
<script>
  const player = window.RufflePlayer.newest().createPlayer();
  document.getElementById("game").appendChild(player);
  player.ruffle().load({ url: "game.swf", autoplay: "on", unmuteOverlay: "hidden", letterbox: "on" });

  // Ruffle's own virtual keyboard sends synthetic key events to the player element the same way.
  const send = (type, key) => player.dispatchEvent(new KeyboardEvent(type, { key, code: key, bubbles: true }));

  for (const btn of document.querySelectorAll(".btn")) {
    const key = btn.dataset.key;
    const up = () => { if (btn.classList.contains("down")) { btn.classList.remove("down"); send("keyup", key); } };
    btn.addEventListener("pointerdown", e => {
      e.preventDefault(); // don't steal focus from the player
      player.focus();
      btn.setPointerCapture(e.pointerId);
      btn.classList.add("down");
      send("keydown", key);
    });
    btn.addEventListener("pointerup", up);
    btn.addEventListener("pointercancel", up);
    btn.addEventListener("lostpointercapture", up);
  }
</script>
</body>
</html>
